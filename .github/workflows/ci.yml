name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 外部 action は commit SHA で固定する（タグは後から別のコミットへ差し替えられる）。
# コメントの版は固定した SHA が指すタグ。
jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version:
          # engines の 2 系統それぞれの**下限そのもの**と最新。"22" / "24" だけだとその系の
          # 最新しか入らず、下限を誰も踏まないまま「通った」ことになる。
          # 下限が 22.22.1 / 24.11.1 なのは、Node の Error 整形（util.inspect）が
          # 読めない Error で例外を投げる挙動が、この 2 版で直っているため（実測で確認）。
          - "22.22.1"
          - "22"
          - "24.11.1"
          - "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm を先に入れる。setup-node の cache: pnpm はこれが居ないと失敗する。
      # 版は package.json の packageManager に従う。
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm run typecheck

      # lint → test → build → 混入検査（組み込みパターンのみ。pull_request からは secret に届かない）
      # → e2e → パッケージ e2e。固有の語まで見る厳格モードの検査は publish.yml 側にある。
      - name: Verify
        run: pnpm run verify

      - name: Pack dry run
        run: npm pack --dry-run
