name: Publish to npm

# GitHub Release を「公開」すると npm に公開する。
# 認証は npm の Trusted Publisher（GitHub Actions の OIDC）で行い、長期トークンは持たない。
# 来歴証明（provenance）は package.json の publishConfig.provenance で有効化してある。
on:
  release:
    types: [published]

# 外部 action は commit SHA で固定する（タグは後から別のコミットへ差し替えられる）。
# コメントの版は固定した SHA が指すタグ。
jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Type check
        run: pnpm run typecheck

      - name: Verify
        run: pnpm run verify

      - name: Pack dry run
        run: npm pack --dry-run

  publish:
    name: Publish
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Trusted Publisher の OIDC と provenance に必要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi

      # 禁止語リストの中身を secret から一時ファイルへ書き出す。
      # 中身は echo せず printf でファイルへ渡すだけにし、シェルのトレース（set -x）も使わない。
      # 置き場所は GITHUB_ENV 経由で後続の step（prepublishOnly の厳格モード検査）に渡す。
      # 書き出しに失敗した・空だったときは、prepublishOnly が厳格モードで落ちる。
      - name: Write the leak denylist from the repository secret
        env:
          DENYLIST_CONTENT: ${{ secrets.FACT_CHECK_LEAK_DENYLIST_CONTENT }}
        run: |
          denylist="$RUNNER_TEMP/leak-denylist.txt"
          printf '%s' "$DENYLIST_CONTENT" > "$denylist"
          echo "FACT_CHECK_LEAK_DENYLIST=$denylist" >> "$GITHUB_ENV"

      # prepublishOnly が typecheck → lint → test → build → check:leaks --require-denylist を回す
      - name: Publish
        run: npm publish
